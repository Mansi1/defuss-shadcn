<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>site-header e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
    <link rel="stylesheet" href="/dist/components/avatar/avatar.css" />
    <link rel="stylesheet" href="/dist/components/input/input.css" />
    <link rel="stylesheet" href="/dist/components/separator/separator.css" />
    <link rel="stylesheet" href="/dist/components/site-header/site-header.css" />
    <style>
      /* docs-utility stand-in (fixtures carry no doc-site CSS) */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
      body { padding: 2rem; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Default 1 -->
<header class="mk-header" style="width:100%">
  <div class="mk-header-inner">
    <a href="#" class="mk-header-brand"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="mk-header-name">Acme Inc.</span></a>
    <nav class="mk-header-nav" aria-label="Main">
      <a href="#" class="mk-header-link">Products</a><a href="#" class="mk-header-link">Solutions</a><a href="#" class="mk-header-link">Pricing</a><a href="#" class="mk-header-link">Company</a>
    </nav>
    <div class="mk-header-actions">
      <button type="button" class="btn" data-variant="ghost" data-size="sm">Login</button>
      <button type="button" class="btn" data-size="sm">Get started</button>
    </div>
  </div>
</header>

    <!-- Sticky 2 -->
<div style="max-height:13rem;overflow:auto;width:100%;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background)">
  <header class="mk-header" data-variant="sticky">
    <div class="mk-header-inner">
      <a href="#" class="mk-header-brand"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="mk-header-name">Acme Inc.</span></a>
      <nav class="mk-header-nav" aria-label="Main"><a href="#" class="mk-header-link">Products</a><a href="#" class="mk-header-link">Pricing</a></nav>
      <div class="mk-header-actions"><button type="button" class="btn" data-size="sm">Get started</button></div>
    </div>
  </header>
  <div style="height:32rem;padding:1.25rem;color:var(--muted-foreground);font-size:0.875rem;">Scroll down — the header stays on top of this box.</div>
</div>
  </body>
</html>
