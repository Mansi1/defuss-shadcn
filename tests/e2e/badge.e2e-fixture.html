<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>badge e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
  </head>
  <!-- plain block flow: a flex body would blockify inline-flex to flex and
       hide the display value the component CSS actually sets -->
  <body style="padding:2rem;">
    <!-- every documented variant instantiated (CSS is the whole contract here) -->
    <span class="badge" id="b-default" data-variant="default">Default</span>
    <span class="badge" id="b-secondary" data-variant="secondary">Secondary</span>
    <span class="badge" id="b-outline" data-variant="outline">Outline</span>
  </body>
</html>
